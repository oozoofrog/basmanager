name: SmartBattery
options:
  bundleIdPrefix: com.oozoofrog
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ko
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: HY47J4787Q
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "9"
targets:
  SmartBattery:
    type: application
    platform: iOS
    sources:
      - SmartBattery
      - SmartBatteryLiveActivityShared
    dependencies:
      - target: SmartBatteryLiveActivity
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oozoofrog.SmartBattery
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Basmanager
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: 주변 스마트 건전지의 잔량과 충전 횟수를 블루투스로 읽습니다.
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
  SmartBatteryLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - SmartBatteryLiveActivity
      - SmartBatteryLiveActivityShared
    info:
      path: SmartBatteryLiveActivity/Info.plist
      properties:
        CFBundleDisplayName: Basmanager
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        APPLICATION_EXTENSION_API_ONLY: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.oozoofrog.SmartBattery.LiveActivity
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"
  SmartBatteryTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - SmartBatteryTests
    dependencies:
      - target: SmartBattery
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  SmartBattery:
    build:
      targets:
        SmartBattery: all
        SmartBatteryTests: [test]
    test:
      targets:
        - SmartBatteryTests
